name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, migrations, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gsms_ci
      JWT_SECRET: ci-secret-assez-long-pour-hs256-uniquement-en-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migrations sur base vide + absence de dérive modèles/schéma
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE gsms_ci"
          alembic upgrade head
          alembic check
      - name: Tests
        run: python -m pytest

  frontend:
    name: Front — types et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      # Les tests de bout en bout (Playwright) de l'ancien front sont à réécrire pour le front Metronic.

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API et worker
        run: docker build -t gsms-backend:ci backend
      - name: Front
        run: docker build -t gsms-frontend:ci frontend
      - name: Configuration serveur
        run: |
          export DOMAIN=ci.exemple.fr POSTGRES_PASSWORD=x JWT_SECRET=x TRAEFIK_NETWORK=proxy TRAEFIK_ENTRYPOINT=websecure TRAEFIK_CERTRESOLVER=letsencrypt
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml -f deploy/docker-compose.caddy.yml config -q
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml -f deploy/docker-compose.traefik.yml config -q
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml -f deploy/docker-compose.traefik-host.yml config -q
