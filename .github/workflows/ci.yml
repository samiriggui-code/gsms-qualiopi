name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, migrations, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gsms_ci
      JWT_SECRET: ci-secret-assez-long-pour-hs256-uniquement-en-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migrations sur base vide + absence de dérive modèles/schéma
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE gsms_ci"
          alembic upgrade head
          alembic check
      - name: Tests
        run: python -m pytest

  frontend:
    name: Front — types, lint, build, Playwright (ordinateur + mobile)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GSMS_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dépendances backend (API réelle pour les tests de bout en bout)
        run: python -m pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances front
        working-directory: frontend
        run: npm ci
      - name: Types, lint, format
        working-directory: frontend
        run: npm run typecheck && npm run lint && npm run format:check
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Navigateur Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        working-directory: frontend
        run: npm run test:e2e
      - name: Rapport et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            frontend/e2e-report
            frontend/e2e-results
          retention-days: 14

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t gsms-backend:ci backend
