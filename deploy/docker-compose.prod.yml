# Serveur : réglages communs, ajoutés au docker-compose.yml de la racine, avec un des deux fichiers de
# publication HTTPS : docker-compose.caddy.yml (serveur libre) ou docker-compose.traefik.yml (Traefik déjà
# en place). deploy/deploy.sh choisit et l'écrit dans .env (COMPOSE_FILE) : ensuite « docker compose » suffit.
services:
  api:
    environment:
      PUBLIC_URL: https://${DOMAIN:?DOMAIN est obligatoire}
      CORS_ORIGINS: https://${DOMAIN}

  worker:
    environment:
      PUBLIC_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
