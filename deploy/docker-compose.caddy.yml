# Serveur sans reverse proxy : le service « web » (Caddy, deploy/web.Dockerfile) prend les ports 80 et 443, obtient
# seul le certificat HTTPS de DOMAIN et publie la landing (/), le back-office (/app/), l'API (/api/) et le moteur IA (/ia/).
services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
