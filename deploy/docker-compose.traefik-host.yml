# Traefik en mode « host » : il joint les conteneurs sur leurs propres réseaux. Le service « web » (Caddy en HTTP
# simple, deploy/web.Dockerfile) reste sur le réseau de l'application (aucun réseau partagé avec les autres
# applications du serveur) et s'y déclare par étiquettes ; il publie la landing, le back-office, l'API et le moteur IA.
services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ":80"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK}
      traefik.http.routers.gsms-qualiopi.rule: Host(`${DOMAIN}`)
      traefik.http.routers.gsms-qualiopi.entrypoints: ${TRAEFIK_ENTRYPOINT}
      traefik.http.routers.gsms-qualiopi.tls: "true"
      traefik.http.routers.gsms-qualiopi.tls.certresolver: ${TRAEFIK_CERTRESOLVER}
      traefik.http.services.gsms-qualiopi.loadbalancer.server.port: "80"
