# Serveur où Traefik tient déjà les ports 80 et 443 (autres sites) : le front s'y déclare par étiquettes,
# Traefik obtient le certificat HTTPS. Valeurs détectées par deploy/deploy.sh et écrites dans .env.
services:
  web:
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK}
      traefik.http.routers.gsms-qualiopi.rule: Host(`${DOMAIN}`)
      traefik.http.routers.gsms-qualiopi.entrypoints: ${TRAEFIK_ENTRYPOINT}
      traefik.http.routers.gsms-qualiopi.tls: "true"
      traefik.http.routers.gsms-qualiopi.tls.certresolver: ${TRAEFIK_CERTRESOLVER}
      traefik.http.services.gsms-qualiopi.loadbalancer.server.port: "3000"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
