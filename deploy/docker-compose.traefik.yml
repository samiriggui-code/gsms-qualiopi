# Serveur où Traefik tient déjà les ports 80 et 443 (autres sites) : le service « web » (Caddy en HTTP simple,
# deploy/web.Dockerfile) s'y déclare par étiquettes et publie la landing (/), le back-office (/app/), l'API (/api/)
# et le moteur IA (/ia/). Traefik obtient le certificat HTTPS. Valeurs détectées par deploy/deploy.sh et écrites dans .env.
services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ":80"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK}
      traefik.http.routers.gsms-qualiopi.rule: Host(`${DOMAIN}`)
      traefik.http.routers.gsms-qualiopi.entrypoints: ${TRAEFIK_ENTRYPOINT}
      traefik.http.routers.gsms-qualiopi.tls: "true"
      traefik.http.routers.gsms-qualiopi.tls.certresolver: ${TRAEFIK_CERTRESOLVER}
      traefik.http.services.gsms-qualiopi.loadbalancer.server.port: "80"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
