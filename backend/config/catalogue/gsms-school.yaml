# Offre de formation de Form'SSI reprise de GSMS School (import : python -m app.cli import-gsms-school).
# Fichier produit le 05/10/2026 par lecture du dépôt gsms-school-aps : fiches vitrine, catalogue, lieux, inventaire.
# Ne sont jamais repris : les taux de réussite et de satisfaction écrits en dur, les notes et avis affichés,
# les fournisseurs, factures et prix d'achat de l'inventaire (fictifs), les sessions de démonstration.
# Chaque écart ou manque est noté dans review_notes ; l'import ne remplace jamais une valeur déjà saisie.
# Complété le 26/10/2026 par les fiches de la landing (section complements_landing, en fin de fichier). Ne sont jamais
# repris de la landing : les textes de remplissage (détail « Approfondissement des objectifs du module … », « Conformité
# avec le référentiel… », tableau de prérequis générique identique sur 31 fiches, axes « Bloc 4 »), les « importances »
# des prérequis (« Obligatoire », « Critique »… sans texte cité), les taux et overviewMetrics, les prix « sur devis »,
# les coordonnées fictives du fournisseur et les sessions de démonstration. Objectifs, moyens, accessibilité et délai
# d'accès restent à saisir par l'organisme.

releve_le: '2026-10-05'
sources:
  school_vitrine: GSMS School, fiches vitrine des formations (apps/lms-crm/i18n/landing-content/sheet-content/*.ts)
  school_catalogue: GSMS School, catalogue des formations (packages/database/prisma/data/formations-catalog.snapshot.json)
  school_lieux: GSMS School, données d'amorçage des sites et salles (school-sites-seed.js, formation-venue-rooms-seed.js)
  school_inventaire: GSMS School, inventaire du matériel pédagogique (equipment-school-inventory-seed.js)
  school_lms: GSMS School, cours en ligne générés à l'amorçage (portal-lms-seed.js)
  landing_fiches: Landing Form'SSI, fiches formation (landing/content/fiches.json), relevé du 26/10/2026
non_importees:
- catalog_slug: tfp-aps
  raison: importée séparément, avec sa fiche complète, par import-formssi
- catalog_slug: commission-securite
  raison: prestation de conseil (préparation aux commissions de sécurité), pas une action de formation ; texte de
    la vitrine repris d'un autre organisme (« SI.Groupe »)
- catalog_slug: intra-entreprise-securite
  raison: 'offre sur mesure sans programme ni durée : à créer formation par formation quand une demande arrive'
formations:
- catalog_slug: mac-aps
  code: MAC-APS
  title: Maintien et actualisation des compétences — Agent de prévention et de sécurité (MAC APS)
  track: SURETE
  pathway: MAC
  skills:
  - Actualisation juridique et déontologique
  - Gestion des conflits et inspection-filtrage
  - Prévention des risques terroristes
  - MAC SST inclus (selon parcours 34h)
  evaluation_steps:
  - title: Évaluation continue
    description: Auto-évaluations quotidiennes et mises en situation réelles sur cas pratiques (incendie, filtrage).
    kind: Pratique
  - title: Test de connaissances
    description: Évaluation écrite finale (QCM/QCU) validant la mise à jour des connaissances juridiques et techniques.
    kind: Théorie
  - title: Attestation de suivi
    description: Remise d'une attestation de suivi de formation MAC APS indispensable pour le renouvellement de
      la carte CNAPS.
    kind: Attestation
  audience: Agents de sécurité (APS)
  delivery_mode: PRESENTIEL
  duration_hours: null
  price_eur: 325
  prerequisites:
  - 'Carte Professionnelle : En cours de validité ou numéro préalable du CNAPS'
  - 'Secourisme : Diplôme SST ou equivalent en cours de validité (pour parcours 27h)'
  - 'SST à renouveler : Certificat SST à renouveler pour le parcours de 34h'
  - 'Moralité : Vérification administrative par le CNAPS'
  content: 'Formation réglementaire obligatoire tous les 5 ans pour le renouvellement de la carte professionnelle
    CNAPS. Répartition: 20% théorique / 80% pratique.'
  teaching_methods: 'Alternance d''apports théoriques et de mises en situation pratiques (répartition annoncée sur
    la vitrine : 20% théorie, 80% pratique).'
  evaluation_methods: 'Évaluation continue : Auto-évaluations quotidiennes et mises en situation réelles sur cas
    pratiques (incendie, filtrage). Test de connaissances : Évaluation écrite finale (QCM/QCU) validant la mise
    à jour des connaissances juridiques et techniques. Attestation de suivi : Remise d''une attestation de suivi
    de formation MAC APS indispensable pour le renouvellement de la carte CNAPS.'
  modules:
  - code: M1
    title: Principes de la République
    details:
    - Liberté, égalité, fraternité, laïcité, non-discrimination.
    - Prévention de la violence, respect de la dignité humaine.
    - Symboles républicains et respect qui leur est dû.
    - État de droit et ordre public.
  - code: M2
    title: Cadre juridique d'intervention
    details:
    - Évolutions du Livre VI et code de déontologie.
    - Port des uniformes et insignes, détention et usage des armes.
    - Légitime défense, atteintes à l'intégrité physique.
    - Obligations et responsabilités (articles 53 et 73 du CPP).
  - code: M3
    title: Compétences opérationnelles générales
    details:
    - 'Gérer les conflits : techniques verbales et maîtrise des émotions.'
    - 'Maîtriser les mesures d''inspection-filtrage : palpations et inspection de bagages.'
    - Modalités d'agrément et cadre législatif.
  - code: M4
    title: Prévention des risques terroristes
    details:
    - Typologie des menaces et niveaux de risques.
    - Vigilance, détection, réflexes de sécurité, profiling.
    - Gestion des foules, réactions adaptées (courir / se cacher / combattre).
    - 'Secourisme tactique : blessures par balles/explosions, gestes de survie.'
  - code: M5
    title: Secourisme - MAC SST
    details:
    - Actualisation des gestes et procédures de secours.
    - Structure d'intervention, analyse des risques, actions de protection.
    - Utilisation du matériel INRS, mannequins, défibrillateur.
  review_notes:
  - champ: duration_hours
    message: 'Durée affichée « 27-34h » (catalogue : « 27h a 34h ») : fourchette non reprise, durée à fixer.'
    source: school_vitrine
  - champ: price_eur
    message: '325 € affichés « a partir de » sur la vitrine : tarif réel et ce qu''il comprend (examen, TVA) à confirmer
      par la direction. La même fiche annonce aussi 650 € dans son encart financement.'
    source: school_vitrine
  - champ: success_rate
