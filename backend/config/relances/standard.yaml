# Relances et communications automatiques — calendrier par défaut de l'organisme.
#
# Qualiopi n'impose aucune relance : il impose des preuves (convocation I09, analyse du besoin I04,
# positionnement I08, émargement I12, évaluations I11, appréciations I30…). Ces règles servent à les
# obtenir à temps. Tout se règle : dates, destinataires, validation avant envoi.
#
#   cle          identifiant stable de la règle
#   portee       INSCRIPTION (un message par stagiaire), SESSION (un par session),
#                JALON (un par jalon de l'échéancier qui passe à échéance ou en retard),
#                HEBDO (un par semaine, le jour indiqué)
#   destinataire STAGIAIRE, SIGNATAIRE (entreprise si convention, sinon stagiaire), FORMATEUR,
#                GESTION, QUALITE, RESPONSABLE_JALON
#   ancre        debut | fin (de la session) ; decalages : jours après l'ancre (négatif = avant)
#   condition    condition nommée, relue juste avant l'envoi : devenue fausse, le message est annulé
#   externe      true : destinataire hors de l'organisme (validation avant envoi au début)
#   indicateurs  indicateurs Qualiopi que la règle aide à démontrer
regles:
  - cle: convention.a_signer
    libelle: Convention ou contrat à signer
    portee: INSCRIPTION
    destinataire: SIGNATAIRE
    ancre: debut
    decalages: [-15, -10, -7]
    condition: convention_non_signee
    modele: convention_a_signer
    externe: true

  - cle: session.rappel
    libelle: Rappel de la session au stagiaire
    portee: INSCRIPTION
    destinataire: STAGIAIRE
    ancre: debut
    decalages: [-2]
    condition: inscription_active
    modele: rappel_session
    externe: true
    indicateurs: [9]

  - cle: formateur.recapitulatif
    libelle: Récapitulatif de la session au formateur
    portee: SESSION
    destinataire: FORMATEUR
    ancre: debut
    decalages: [-7]
    condition: session_a_venir
    modele: recapitulatif_formateur
    indicateurs: [10, 21]

  - cle: formateur.evaluations
    libelle: Évaluations des acquis à saisir
    portee: SESSION
    destinataire: FORMATEUR
    ancre: fin
    decalages: [1, 4]
    condition: evaluations_manquantes
    modele: evaluations_manquantes
    indicateurs: [11]

  - cle: echeancier.alerte
    libelle: Jalon de l'échéancier à échéance ou en retard
    portee: JALON
    destinataire: RESPONSABLE_JALON
    condition: jalon_non_fait
    modele: alerte_jalon

  - cle: qualite.synthese
    libelle: Synthèse hebdomadaire qualité
    portee: HEBDO
    jour: lundi
    destinataire: QUALITE
    condition: toujours
    modele: synthese_qualite

  # ── Questionnaires en ligne (lien personnel, sans compte) ────────────────────
  - cle: questionnaire.besoin
    libelle: Questionnaire d'analyse du besoin et de positionnement
    portee: INSCRIPTION
    destinataire: STAGIAIRE
    ancre: debut
    decalages: [-15, -10, -7]
    condition: besoin_a_recueillir
    modele: questionnaire
    questionnaire: BESOIN_POSITIONNEMENT
    externe: true
    indicateurs: [4, 8]

  - cle: questionnaire.chaud
    libelle: Questionnaire de satisfaction à chaud
    portee: INSCRIPTION
    destinataire: STAGIAIRE
    ancre: fin
    decalages: [0, 2, 5]
    condition: satisfaction_chaud_a_recueillir
    modele: questionnaire
    questionnaire: SATISFACTION_CHAUD
    externe: true
    indicateurs: [30]

  - cle: questionnaire.froid
    libelle: Questionnaire de satisfaction à froid
    portee: INSCRIPTION
    destinataire: STAGIAIRE
    ancre: fin
    decalages: [45, 52]
    condition: satisfaction_froid_a_recueillir
    modele: questionnaire
    questionnaire: SATISFACTION_FROID
    externe: true
    indicateurs: [30]

  - cle: questionnaire.entreprise
    libelle: Évaluation à froid par l'entreprise
    portee: INSCRIPTION
    destinataire: ENTREPRISE
    ancre: fin
    decalages: [60, 67]
    condition: entreprise_a_recueillir
    modele: questionnaire
    questionnaire: ENTREPRISE_FROID
    externe: true
    indicateurs: [30]

  # ── Documents rédigés par le moteur, transmis au stagiaire (lien sécurisé) ───
  - cle: document.convocation
    libelle: Convocation transmise au stagiaire
    portee: INSCRIPTION
    destinataire: STAGIAIRE
    ancre: debut
    decalages: [-10, -5]
    condition: convocation_a_transmettre
    modele: document_disponible
    document: CONVOCATION
    externe: true
    indicateurs: [9]

  - cle: document.attestation
    libelle: Attestation de fin transmise au stagiaire
    portee: INSCRIPTION
    destinataire: STAGIAIRE
    ancre: fin
    decalages: [3, 7, 14]
    condition: attestation_a_transmettre
    modele: document_disponible
    document: ATTESTATION_FIN
    externe: true
    indicateurs: [11]
