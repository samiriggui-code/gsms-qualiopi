# Noms d'affichage des critères et indicateurs Qualiopi (éditoriaux, fournis par l'organisme).
# Ils rendent l'interface lisible ; ils ne remplacent jamais le libellé officiel du Référentiel national
# qualité, toujours conservé et affiché dans la fiche et dans les exports d'audit avec le numéro.
# Rattachement réglementaire : C1 1–3, C2 4–8, C3 9–16, C4 17–20, C5 21–22, C6 23–29, C7 30–32
# (l'indicateur 33 est créé par le référentiel V10, applicable au 1er novembre 2026).

criteres:
  1: { nom: "Information du public", indicateurs: [1, 3] }
  2: { nom: "Conception des prestations", indicateurs: [4, 8] }
  3: { nom: "Accompagnement et évaluation", indicateurs: [9, 16] }
  4: { nom: "Moyens et ressources", indicateurs: [17, 20] }
  5: { nom: "Compétences des intervenants", indicateurs: [21, 22] }
  6: { nom: "Environnement professionnel", indicateurs: [23, 29] }
  7: { nom: "Satisfaction et amélioration continue", indicateurs: [30, 32] }

