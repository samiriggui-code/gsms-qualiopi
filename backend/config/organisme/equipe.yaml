# ou jeunes adultes du genre du prénom, jamais une image d'enfant ni le double d'une photo de l'équipe (3 = 16). Trop
# peu de portraits de femmes : chaque photo de femme sert au plus à deux stagiaires, les suivantes gardent leurs initiales.
stagiaires:
  F: [21, 23, 34, 5, 1]
