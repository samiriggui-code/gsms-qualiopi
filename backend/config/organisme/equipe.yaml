# Équipe présentée sur la landing (landing/content/school.ts, cartes « trainers », texte français) et reprise dans le
# back-office : les 6 formateurs deviennent des formateurs (formation.trainer), les 9 autres du personnel
# (rh.staff_member, volet direction, pedagogique ou rh). Relevé du 26/10/2026. Personnes FICTIVES de démonstration :
# créées par seed-demo (acteur « démo »), retirées par retirer-demo ; l'équipe réelle sera saisie par l'organisme.
#
# Photo : numéro de media/avatars/300-<n>.png, IDENTIQUE à la landing (landing/app/widgets.tsx, `trainerPhoto` :
# 300-{6 + rang dans la liste aplatie des volets}), à la demande du propriétaire. Selon le classement ci-dessous, six
# portraits ne correspondent pas au genre du prénom (Claire Dumont 6, Julien Roche 7, Nora Lefèvre 8, Nadia Khelifi
# 12, Jean-Claude Renard 13, Émilie Bernard 17) : à corriger ici et sur la landing en même temps, si on le décide.
# Les certifications de la landing deviennent des spécialités du formateur, pas des titres : un texte de vitrine ne
# prouve aucun titre (les titres se saisissent avec leur justificatif).
#
# Classement des 34 images (regardées une par une) : genre F/H, age adulte, jeune (jeune adulte) ou enfant ;
# meme_que : même personne qu'une autre image (jamais utilisées toutes les deux).
