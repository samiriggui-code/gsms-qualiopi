# GSMS — un monolithe (API), un worker, une base, et le moteur IA (ia-*). En local, le back-office (app/) et la
# landing tournent avec scripts/dev.sh. Sur un serveur, deploy/deploy.sh ajoute deploy/docker-compose.prod.yml et le
# service « web » (Caddy : landing, back-office, API et moteur IA sur une seule origine) : voir deploy/README.md.
# Secrets obligatoires (pas de valeur par défaut) : POSTGRES_PASSWORD, JWT_SECRET. Voir .env.example.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gsms
      POSTGRES_USER: gsms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
    volumes:
      - gsms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsms -d gsms"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &backend-env
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://gsms:${POSTGRES_PASSWORD}@db:5432/gsms
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire (32 caractères minimum)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Envoi des e-mails (serveur SMTP de l'organisme ; Mailpit en local).
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@gsms.local}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Moteur IA (service ia-app ci-dessous) ; compte de service créé au premier appel.
      WEKNORA_URL: ${WEKNORA_URL:-http://ia-app:8080}
      WEKNORA_SERVICE_EMAIL: ${WEKNORA_SERVICE_EMAIL:-}
      WEKNORA_SERVICE_PASSWORD: ${WEKNORA_SERVICE_PASSWORD:-}
    volumes:
      - gsms-documents:/app/var/documents
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # Prête quand les migrations sont passées et que l'API répond.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 60

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    command: ["python", "-m", "app.cmd.worker"]

  # ── Moteur IA (fork WeKnora de Global-IT-SS) : bases de connaissances, recherche, chat, agents ──
  # Images construites depuis global-it-ss-template/backend (jamais tirées de Docker Hub).
  # Secrets dans ia/.env (voir ia/.env.example). API WeKnora : 127.0.0.1:${IA_PORT:-4103}.
  ia-app:
    image: gitss-app:local
    pull_policy: never
    restart: unless-stopped
    env_file: [ia/.env]
    environment:
      FRONTEND_BASE_URL: ${PUBLIC_URL:-}
      # Le moteur IA bloque par défaut les adresses internes (SSRF) : on autorise l'API Qualiopi (service « api »),
      # dont il consomme le serveur MCP (http://api:8000/api/v1/mcp).
      SSRF_WHITELIST_EXTRA: api
    depends_on:
      ia-postgres:
        condition: service_healthy
      ia-redis:
        condition: service_started
      ia-docreader:
        condition: service_started
    volumes:
      - ia-files:/data/files
      - ia-docreader-tmp:/tmp/docreader:ro
      - ./ia/config/config.yaml:/app/config/config.yaml
    ports:
      - "127.0.0.1:${IA_PORT:-4103}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  ia-docreader:
    image: gitss-docreader:local
    pull_policy: never
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
    volumes:
      - ia-docreader-tmp:/tmp/docreader
    expose:
      - "50051"

  ia-postgres:
    image: paradedb/paradedb:v0.25.11-pg17
    restart: unless-stopped
    env_file: [ia/.env]
    volumes:
      - ia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weknora"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  ia-redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${IA_REDIS_PASSWORD:?IA_REDIS_PASSWORD est obligatoire (voir ia/.env)}

volumes:
  gsms-postgres:
  gsms-documents:
  ia-postgres:
  ia-files:
  ia-docreader-tmp:
