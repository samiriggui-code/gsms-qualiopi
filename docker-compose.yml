# GSMS — un front, un monolithe, un worker, une base.
# Sur un serveur, ajouter deploy/docker-compose.prod.yml (HTTPS automatique) : voir deploy/README.md.
# Secrets obligatoires (pas de valeur par défaut) : POSTGRES_PASSWORD, JWT_SECRET. Voir .env.example.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gsms
      POSTGRES_USER: gsms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
    volumes:
      - gsms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsms -d gsms"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &backend-env
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://gsms:${POSTGRES_PASSWORD}@db:5432/gsms
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire (32 caractères minimum)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Envoi des e-mails (serveur SMTP de l'organisme ; Mailpit en local).
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@gsms.local}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - gsms-documents:/app/var/documents
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # Prête quand les migrations sont passées et que l'API répond.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 60

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    command: ["python", "-m", "app.worker"]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Le navigateur ne parle qu'au front ; le front relaie vers l'API sur le réseau interne.
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  gsms-postgres:
  gsms-documents:
